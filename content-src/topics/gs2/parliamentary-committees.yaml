intro_anchors:
  - Parliamentary committees act as the specialised extension of Parliament for detailed legislative and executive scrutiny.
conclusion_anchors:
  - Effective committees convert formal parliamentary supremacy into substantive executive accountability while complementing floor debate.
future_variants:
  - Declining committee referral and quality of legislation
  - Committee system under conditions of executive dominance
  - Professional research capacity for parliamentary scrutiny
  - Effectiveness of non-binding committee recommendations

