schema: mains-topic-v1
id: gs2-polity-parliamentary-committees
title: Parliamentary Committees
paper: GS2
optional_id: null
node_type: core

syllabus:
  primary: gs2-polity-parliament-state-legislatures
  secondary: [gs2-governance-accountability]

scope:
  includes:
    - committee system
    - department-related standing committees
    - financial committees
    - legislative scrutiny
    - executive accountability
    - committee effectiveness
    - committee reform
  excludes: [Speaker, anti-defection, parliamentary privileges, bicameralism]
  cross_links: []

thesis: >
  Parliamentary committees convert episodic floor accountability into
  continuous, specialised and relatively deliberative scrutiny of legislation,
  expenditure and administration.

pyqs:
  - id: GS2-63
    role: primary
    demand_refs: [executive-accountability, financial-control]
  - id: GS2-64
    role: primary
    demand_refs: [utility, financial-control]
  - id: GS2-69
    role: primary
    demand_refs: [executive-accountability, effectiveness]
  - id: GS2-73
    role: primary
    demand_refs: [structure, financial-control, institutionalisation]

