concepts:
  - id: power-of-purse
    label: Power of the purse
    definition: Parliament's authority to authorise, scrutinise and review public expenditure.
    use: Financial committee questions.

arguments:
  - id: standing-ad-hoc
    keyword: Standing and ad hoc committees
    line: The committee system combines permanent standing bodies with issue- or Bill-specific ad hoc committees.
    dimensions: [institutional]
    demand_refs: [structure]
    evidence_refs: []
    thinker_refs: []
    counterpoint_refs: []
    priority: A
  - id: specialised-scrutiny
    keyword: Specialised scrutiny
    line: Detailed ministry- and subject-specific examination compensates for limited floor time and improves legislative scrutiny.
    dimensions: [institutional, legislative]
    demand_refs: [utility, executive-accountability, effectiveness]
    evidence_refs: [ev-gs2-motor-vehicles-committee]
    thinker_refs: []
    counterpoint_refs: [low-referral]
    priority: A
  - id: specialisation
    keyword: Legislative specialisation
    line: Repeated sectoral exposure develops domain familiarity among MPs and narrows the legislature–executive information gap.
    dimensions: [institutional]
    demand_refs: [utility, institutionalisation]
    evidence_refs: []
    thinker_refs: []
    counterpoint_refs: [short-tenure]
    priority: A
  - id: executive-accountability
    keyword: Continuous executive accountability
    line: Ministries and officials face detailed examination beyond episodic floor mechanisms, extending parliamentary oversight.
    dimensions: [accountability, governance]
    demand_refs: [executive-accountability, effectiveness]
    evidence_refs: []
    thinker_refs: []
    counterpoint_refs: [advisory-character]
    priority: A
  - id: financial-control
    keyword: Financial accountability
    line: PAC, Estimates Committee and COPU operationalise Parliament's power of the purse through complementary scrutiny.
    dimensions: [financial, institutional]
    demand_refs: [financial-control, institutionalisation]
    evidence_refs: []
    thinker_refs: []
    counterpoint_refs: []
    priority: A
  - id: financial-committee-distinction
    keyword: Complementary financial scrutiny
    line: PAC examines propriety of expenditure, Estimates Committee stresses economy and efficiency, while COPU scrutinises public enterprises.
    dimensions: [financial]
    demand_refs: [structure, financial-control]
    evidence_refs: []
    thinker_refs: []
    counterpoint_refs: []
    priority: A
  - id: deliberative-space
    keyword: Deliberative space
    line: Smaller cross-party forums permit less adversarial and more detailed discussion than the full House.
    dimensions: [political, deliberative]
    demand_refs: [utility]
    evidence_refs: []
    thinker_refs: []
    counterpoint_refs: []
    priority: A
  - id: expert-input
    keyword: Expert and stakeholder input
    line: Committees can obtain specialised testimony and official evidence, making legislative examination more evidence-based.
    dimensions: [institutional]
    demand_refs: [utility]
    evidence_refs: []
    thinker_refs: []
    counterpoint_refs: []
    priority: B
  - id: burden-sharing
    keyword: Institutional burden sharing
    line: Delegating technical scrutiny to smaller bodies frees floor time without surrendering parliamentary oversight.
    dimensions: [institutional]
    demand_refs: [institutionalisation]
    evidence_refs: []
    thinker_refs: []
    counterpoint_refs: []
    priority: B
  - id: low-referral
    keyword: Declining referral
    line: When major Bills bypass committee scrutiny, Parliament loses an important stage of detailed legislative examination.
    dimensions: [legislative]
    demand_refs: [effectiveness]
    evidence_refs: [ev-gs2-bill-referral-17ls]
    thinker_refs: []
    counterpoint_refs: [mandatory-referral]
    priority: A
  - id: short-tenure
    keyword: Weak institutional memory
    line: Short committee tenure limits continuity and accumulation of subject expertise.
    dimensions: [institutional]
    demand_refs: [effectiveness]
    evidence_refs: []
    thinker_refs: []
    counterpoint_refs: [research-support]
    priority: A
  - id: research-deficit
    keyword: Research-capacity deficit
    line: Limited dedicated expert support constrains scrutiny of increasingly technical legislation and policy.
    dimensions: [institutional]
    demand_refs: [effectiveness]
    evidence_refs: []
    thinker_refs: []
    counterpoint_refs: [research-support]
    priority: A
  - id: advisory-character
    keyword: Advisory recommendations
    line: Committee recommendations generally lack binding force, weakening implementation where executive follow-through is poor.
    dimensions: [accountability]
    demand_refs: [executive-accountability, effectiveness]
    evidence_refs: []
    thinker_refs: []
    counterpoint_refs: []
    priority: A
  - id: weak-follow-through
    keyword: Weak follow-through
    line: Insufficient floor discussion and action on committee findings may reduce their institutional influence.
    dimensions: [institutional]
    demand_refs: [executive-accountability]
    evidence_refs: []
    thinker_refs: []
    counterpoint_refs: []
    priority: B
  - id: mandatory-referral
    keyword: Presumptive Bill referral
    line: Significant non-urgent Bills should ordinarily undergo committee scrutiny before final passage.
    dimensions: [reform]
    demand_refs: [effectiveness]
    evidence_refs: []
    thinker_refs: []
    counterpoint_refs: []
    priority: A
  - id: research-support
    keyword: Professional committee support
    line: Permanent research and domain expertise can strengthen continuity, technical scrutiny and institutional memory.
    dimensions: [reform]
    demand_refs: [effectiveness]
    evidence_refs: []
    thinker_refs: []
    counterpoint_refs: []
    priority: A

